<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BILLI Voice Lite — Mode Test</title>
<style>
:root{color-scheme:dark}body{font:16px system-ui;background:#101820;color:#eee;padding:18px;max-width:560px;margin:auto}
select,input,button{font:inherit;padding:11px;margin:5px 3px;border-radius:9px;border:1px solid #53616e}
button{background:#d7dce2;color:#111;border:0;font-weight:650}
.panel{padding:14px;border:1px solid #52606b;border-radius:14px;background:#1b2833}
#face{height:110px;display:grid;place-items:center;background:#000;border-radius:12px;margin:12px 0;color:#fff}
#eyes{font-size:40px;letter-spacing:18px;font-weight:700}
#modeName{font-weight:700}
pre{white-space:pre-wrap;background:#22303b;padding:12px;border-radius:10px}
</style>
</head>
<body>
<h1>BILLI Voice Lite</h1>
<div class="panel">
<label for="mode">Operating mode</label>
<select id="mode"><option value="standard">Standard — white graphics / warm voice</option><option value="rugged">Rugged — red graphics / firm voice</option></select>
<div id="face"><div id="eyes">▢ ▢</div></div>
<p id="modeName">Standard mode</p>
<label for="lang">Language</label>
<select id="lang"><option value="en-US">English</option><option value="ta-IN">Tamil</option><option value="si-LK">Sinhala</option></select>
<br>
<input id="text" placeholder="Speak or type a test phrase" style="width:min(92%,390px)">
<button id="mic">Mic</button><button id="speak">Speak</button>
<pre id="out">Ready</pre>
</div>
<script>
const modeEl=document.getElementById('mode'),lang=document.getElementById('lang'),input=document.getElementById('text'),out=document.getElementById('out');
const eyes=document.getElementById('eyes'),modeName=document.getElementById('modeName');
const profiles={standard:{pitch:1.05,rate:1.0,style:'warm'},rugged:{pitch:0.82,rate:0.92,style:'firm'}};
function applyMode(){const rugged=modeEl.value==='rugged';const color=rugged?'#ff3030':'#ffffff';eyes.style.color=color;modeName.textContent=rugged?'Rugged mode — red face / firm voice':'Standard mode — white face / warm voice';out.textContent='Mode: '+modeEl.value+' | voice profile: '+profiles[modeEl.value].style;}
modeEl.addEventListener('change',applyMode);
document.getElementById('mic').addEventListener('click',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){out.textContent='Speech recognition is not supported in this browser';return;}const rec=new SR();rec.lang=lang.value;rec.onresult=e=>{input.value=e.results[0][0].transcript;out.textContent='Recognized: '+input.value;};rec.onerror=e=>out.textContent='Recognition error: '+e.error;rec.start();});
document.getElementById('speak').addEventListener('click',()=>{if(!window.speechSynthesis){out.textContent='Speech output unavailable';return;}const p=profiles[modeEl.value],u=new SpeechSynthesisUtterance(input.value);u.lang=lang.value;u.rate=p.rate;u.pitch=p.pitch;const voices=speechSynthesis.getVoices();const match=voices.find(v=>v.lang.toLowerCase()===lang.value.toLowerCase());if(match)u.voice=match;speechSynthesis.cancel();speechSynthesis.speak(u);out.textContent='Speaking with '+p.style+' profile. Actual voice depends on device/browser voice support.';});
applyMode();
</script>
</body>
</html>
